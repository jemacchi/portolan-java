name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Check tag and project versions
        shell: bash
        run: |
          project_version="$(python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("pom.xml").getroot(); print(root.find("{http://maven.apache.org/POM/4.0.0}version").text)')"
          release_version="${project_version%-SNAPSHOT}"
          test "${GITHUB_REF_NAME}" = "v${release_version}"
          echo "RELEASE_VERSION=${release_version}" >> "${GITHUB_ENV}"

      - name: Set release version
        run: >-
          mvn --batch-mode versions:set
          -DnewVersion="${RELEASE_VERSION}"
          -DgenerateBackupPoms=false

      - name: Test and build release artifacts
        run: mvn --batch-mode --no-transfer-progress -Prelease clean verify

      - name: Stage release metadata
        shell: bash
        run: |
          cp pom.xml "target/portolan-java-${RELEASE_VERSION}.pom"
          sha256sum \
            "target/portolan-java-${RELEASE_VERSION}.jar" \
            "target/portolan-java-${RELEASE_VERSION}-sources.jar" \
            "target/portolan-java-${RELEASE_VERSION}-javadoc.jar" \
            "target/portolan-java-${RELEASE_VERSION}.pom" \
            > target/SHA256SUMS

      - name: Publish to GitHub Packages
        if: vars.PUBLISH_GITHUB_PACKAGES == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "target/portolan-java-${RELEASE_VERSION}.jar"
          "target/portolan-java-${RELEASE_VERSION}-sources.jar"
          "target/portolan-java-${RELEASE_VERSION}-javadoc.jar"
          "target/portolan-java-${RELEASE_VERSION}.pom"
          target/SHA256SUMS
          --generate-notes
          --verify-tag
